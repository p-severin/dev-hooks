name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Pyright
        run: .venv/bin/pyright
      - name: Tests
        run: .venv/bin/pytest
      - name: Pre-commit
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          pre-commit run --all-files
