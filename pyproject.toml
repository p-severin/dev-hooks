[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-hooks"
version = "0.1.0"
description = "Shared pre-commit hooks for file size, comments, fixture data, and secret files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyright>=1.1.400",
    "pre-commit>=4",
    "ruff>=0.11",
]

[project.scripts]
file-token-limit = "dev_hooks.tokens:main"
comment-ban = "dev_hooks.comments:main"
pii-fixtures = "dev_hooks.pii:main"
forbid-env-files = "dev_hooks.env_files:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "ruff.shared.toml"
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
